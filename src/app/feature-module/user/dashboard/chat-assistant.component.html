<div class="chat-container">
  <div class="chat-header">
    <div class="header-content">
      <i class="fas fa-robot"></i>
      <h3>Assistant d'Apprentissage</h3>
      <span class="status-indicator" [ngClass]="{'ai-mode': isAIChatMode}"></span>
      <div *ngIf="isAIChatMode" class="ai-mode-badge">IA</div>
    </div>
  </div>

  <div class="chat-messages">
    <!-- Chat Messages -->
    <div *ngFor="let message of messages" class="message-wrapper" 
         [ngClass]="{'bot-message': message.isBot, 'user-message': !message.isBot, 'recommendation-message': message.isRecommendation}">
      
      <div class="message-content" [ngClass]="{'recommendation-content': message.isRecommendation}">
        <div class="message-text" [innerHTML]="message.text | nl2br"></div>
        
        <!-- Question List Options -->
        <div *ngIf="message.options && message.questionType === 'question-list'" 
             class="question-list">
          <button *ngFor="let question of message.options" 
                  type="button"
                  class="question-btn"
                  [ngClass]="{'ai-option': question.includes('🤖')}"
                  (click)="selectQuestion(question)">
            {{ question }}
          </button>
        </div>
        
        <!-- AI Chat Options -->
        <div *ngIf="message.options && message.questionType === 'ai-chat'" 
             class="ai-chat-options">
          <button *ngFor="let option of message.options" 
                  type="button"
                  class="ai-option-btn"
                  (click)="toggleAITuning()">
            {{ option }}
          </button>
          <button type="button" class="exit-ai-btn" (click)="exitAIChat()">
            🔙 Retour aux questions
          </button>
        </div>
        
        <!-- Multiple Choice Options -->
        <div *ngIf="message.options && message.questionType === 'multiple-choice' && !message.isRecommendation" 
             class="message-options">
          <button *ngFor="let option of message.options" 
                  type="button"
                  class="option-btn"
                  (click)="selectOption(option, message.questionIndex!)">
            {{ option }}
          </button>
        </div>
        
        <!-- Yes/No Options -->
        <div *ngIf="message.options && message.questionType === 'yes-no' && message.questionIndex !== -1" 
             class="message-options">
          <button *ngFor="let option of message.options" 
                  type="button"
                  class="option-btn"
                  [ngClass]="option === 'Oui' ? 'btn-success' : 'btn-danger'"
                  (click)="selectOption(option, message.questionIndex!)">
            {{ option }}
          </button>
        </div>
        
        <!-- More Questions Yes/No -->
        <div *ngIf="message.options && message.questionType === 'yes-no' && message.questionIndex === -1" 
             class="message-options">
          <button *ngFor="let option of message.options" 
                  type="button"
                  class="option-btn"
                  [ngClass]="option.includes('Oui') ? 'btn-success' : 'btn-danger'"
                  (click)="handleMoreQuestions(option)">
            {{ option }}
          </button>
        </div>
        
        <!-- Final Action Buttons -->
        <div *ngIf="message.options && message.isRecommendation && message.recommendationType === 'final'" 
             class="final-actions">
          <button *ngFor="let action of message.options" 
                  type="button"
                  class="action-btn"
                  (click)="handleFinalAction(action)">
            {{ action }}
          </button>
        </div>
        
        <div class="message-time">{{ message.timestamp | date:'HH:mm' }}</div>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div *ngIf="isTyping" class="message-wrapper bot-message">
      <div class="message-content">
        <div class="typing-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="typing-text">L'IA réfléchit...</div>
      </div>
    </div>
  </div>

  <!-- AI Tuning Panel -->
  <div *ngIf="showAITuning && isAIChatMode" class="ai-tuning-panel">
    <div class="tuning-header">
      <h4>⚙️ Réglages de l'IA</h4>
      <button type="button" class="close-tuning" (click)="toggleAITuning()">×</button>
    </div>
    
    <div class="tuning-options">
      <div class="tuning-group">
        <label>Personnalité :</label>
        <select [(ngModel)]="aiPersonality" class="tuning-select" name="personality">
          <option value="helpful">Serviable</option>
          <option value="professional">Professionnel</option>
          <option value="friendly">Amical</option>
        </select>
      </div>
      
      <div class="tuning-group">
        <label>Longueur des réponses :</label>
        <select [(ngModel)]="aiResponseLength" class="tuning-select" name="responseLength">
          <option value="short">Courtes</option>
          <option value="medium">Moyennes</option>
          <option value="detailed">Détaillées</option>
        </select>
      </div>
      
      <div class="tuning-group">
        <label>Niveau d'expertise :</label>
        <select [(ngModel)]="aiExpertise" class="tuning-select" name="expertise">
          <option value="beginner">Débutant</option>
          <option value="intermediate">Intermédiaire</option>
          <option value="advanced">Avancé</option>
        </select>
      </div>
    </div>
    
    <div class="tuning-footer">
      <button type="button" class="apply-tuning-btn" (click)="toggleAITuning()">
        ✅ Appliquer
      </button>
    </div>
  </div>

  <!-- Text Input -->
  <div *ngIf="showInput" class="chat-input">
    <div class="input-group">
      <input type="text" 
             class="text-input" 
             [(ngModel)]="userInput"
             (keydown)="onKeyDown($event)"
             [placeholder]="isAIChatMode ? 'Posez votre question à l\'IA...' : 'Tapez votre réponse...'"
             [disabled]="isTyping"
             autocomplete="off">
      <button class="send-btn" 
              type="button"
              (click)="onSendButtonClick()"
              [disabled]="!userInput?.trim() || isTyping">
        <i class="fas fa-paper-plane" *ngIf="!isTyping"></i>
        <i class="fas fa-spinner fa-spin" *ngIf="isTyping"></i>
      </button>
    </div>
  </div>
</div>
