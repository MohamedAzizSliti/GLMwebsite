<div class="question-container">
  <div class="question-header">
    <h3>Question {{ questionIndex + 1 }} / {{ totalQuestions }}</h3>
  </div>

  <div class="question-text">
    <p>{{ question?.question || question?.question_text }}</p>
  </div>

  <div class="options-container">
    <!-- Options pour les questions à choix unique -->
    <div *ngIf="question?.type === 'single_choice' || question?.question_type === 'single_choice'" class="single-choice-options">
      <div
        *ngFor="let option of getAvailableOptionKeys()"
        class="option-item"
        [class.selected]="isOptionSelected(option)"
        (click)="selectSingleOption(option)">

        <div class="radio-button">
          <div class="radio-inner" *ngIf="isOptionSelected(option)"></div>
        </div>

        <div class="option-text">
          {{ getOptionText(option) }}
        </div>
      </div>
    </div>

    <!-- Options pour les questions à choix multiples -->
    <div *ngIf="question?.type === 'multiple_choice' || question?.question_type === 'multiple_choice'" class="multiple-choice-options">
      <div
        *ngFor="let option of getAvailableOptionKeys()"
        class="option-item"
        [class.selected]="isOptionSelected(option)"
        (click)="toggleMultipleOption(option, !isOptionSelected(option))">

        <div class="checkbox-button">
          <div class="checkbox-inner" *ngIf="isOptionSelected(option)">✓</div>
        </div>

        <div class="option-text">
          {{ getOptionText(option) }}
        </div>
      </div>
    </div>

    <!-- Options pour les questions binaires (vrai/faux) -->
    <div *ngIf="question?.type === 'binary'" class="binary-options">
      <div class="option-item" [class.selected]="isOptionSelected('option_1')" (click)="selectSingleOption('option_1')">
        <div class="radio-button">
          <div class="radio-inner" *ngIf="isOptionSelected('option_1')"></div>
        </div>
        <div class="option-text">{{ getOptionText('option_1') || 'Oui' }}</div>
      </div>
      
      <div class="option-item" [class.selected]="isOptionSelected('option_2')" (click)="selectSingleOption('option_2')">
        <div class="radio-button">
          <div class="radio-inner" *ngIf="isOptionSelected('option_2')"></div>
        </div>
        <div class="option-text">{{ getOptionText('option_2') || 'Non' }}</div>
      </div>
    </div>
  </div>
</div>
